[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md-link-check"
version = "0.1.0"
description = "检查 Markdown 中的本地链接、标题锚点与外部链接是否可用"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["markdown", "link-checker", "docs", "cli", "ci"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Documentation",
]

[project.scripts]
mdlink = "mdlinkcheck.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/md-link-check"
Source = "https://github.com/eastyou/md-link-check"

[tool.setuptools]
packages = ["mdlinkcheck"]
